[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "acp"
version = "0.1.1"
description = "A personal, event-driven Kanban for Claude Code and Codex"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "mcp>=1.26,<2",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
browser = ["playwright>=1.49,<2"]

[tool.uv]
required-version = ">=0.13.1"

[project.scripts]
acp = "acp.cli:main"

[tool.setuptools.package-data]
acp = ["static/*", "workflow.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
